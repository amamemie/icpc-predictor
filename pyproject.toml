[project]
name = "icpc-predictor"
version = "0.1.0"
description = "Predicción del ranking de equipos en competencias ICPC a partir de ratings de Codeforces y resultados previos"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=8.2",
    "pandas>=2.2",
    "rapidfuzz>=3.6",
    "unidecode>=1.3",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
analisis = ["shap>=0.45", "matplotlib>=3.8", "jupyter>=1.0"]
app = ["streamlit>=1.35"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["db*", "scrapers*", "matching*", "features*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
